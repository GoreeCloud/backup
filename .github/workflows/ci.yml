name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source SHA-256 manifest
        run: sha256sum --check SHA256SUMS
      - name: JavaScript syntax
        run: node --check internal/control/static/app.js
      - name: Python acceptance-script syntax
        run: python3 -m py_compile scripts/smoke-api-e2e.py scripts/smoke-trigger-verify.py
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/...
