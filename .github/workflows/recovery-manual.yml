name: Recovery Integration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-recovery:
    name: isolated-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: |
            third_party/kopia/go.sum
            third_party/rclone/go.sum
      - name: Verify pinned imported engine source
        run: sha256sum -c --status third_party/sources.sha256
      - name: Install disposable recovery sandbox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Compile the included Kopia and Rclone sources
        run: ./scripts/build-upstreams.sh
      - name: Isolated encrypted archive, deduplication and restore
        run: PATH="$PWD/build/bin:$PATH" ./scripts/smoke-isolated.sh
      - name: Isolated encrypted pack corruption detection
        run: PATH="$PWD/build/bin:$PATH" ./scripts/smoke-corruption-isolated.sh
      # Ubuntu 24.04 GitHub-hosted runners may use AppArmor to deny
      # unprivileged user-namespace UID maps. Change this only on the disposable
      # test VM and only for the duration of the synthetic restore drill.
      - name: Permit unprivileged user namespace for isolated restore test
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/gcb-original-userns-policy"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Isolated authenticated HTTP, CLI and contained restore
        run: PATH="$PWD/build/bin:$PATH" ./scripts/smoke-api-isolated.sh
      - name: Restore GitHub runner user namespace policy
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gcb-original-userns-policy" ]; then
            original="$(cat "$RUNNER_TEMP/gcb-original-userns-policy")"
            case "$original" in
              0|1) sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$original" ;;
              *) echo 'Unable to restore unexpected user namespace policy value' >&2; exit 1 ;;
            esac
          fi
