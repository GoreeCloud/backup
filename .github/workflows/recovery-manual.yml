name: Recovery Integration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-recovery:
    name: isolated-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: |
            third_party/kopia/go.sum
            third_party/rclone/go.sum
      - name: Verify pinned imported engine source
        run: sha256sum -c --status third_party/sources.sha256
      - name: Install Bubblewrap and Ubuntu's scoped AppArmor profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor-profiles apparmor-utils
          # Ubuntu 24.04 restricts unprivileged user namespaces. Load only
          # the distribution-shipped bwrap profile on this disposable runner;
          # never disable AppArmor protection globally.
          test -s /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Verify actual sandbox execution and write isolation
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          trap 'rm -rf -- "$workspace"' EXIT
          mkdir "$workspace/inside"
          printf 'unchanged\n' > "$workspace/outside"
          bwrap --die-with-parent --new-session --unshare-user --unshare-pid \
            --ro-bind / / --proc /proc --dev /dev \
            --bind "$workspace/inside" "$workspace/inside" \
            -- /bin/sh -c 'printf executed > "$1"; if printf tampered > "$2"; then exit 83; fi' \
            _ "$workspace/inside/marker" "$workspace/outside"
          grep -qx executed "$workspace/inside/marker"
          grep -qx unchanged "$workspace/outside"
      - name: Compile the included Kopia and Rclone sources
        run: ./scripts/build-upstreams.sh
      - name: Isolated encrypted archive, deduplication and restore
        run: PATH="$PWD/build/bin:$PATH" ./scripts/smoke-isolated.sh
      - name: Isolated encrypted pack corruption detection
        run: PATH="$PWD/build/bin:$PATH" ./scripts/smoke-corruption-isolated.sh
      - name: Isolated authenticated HTTP, CLI and contained restore
        run: PATH="$PWD/build/bin:$PATH" ./scripts/smoke-api-isolated.sh
