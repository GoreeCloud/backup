name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish web development build (7-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-backup-web-development
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
  android:
    name: android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Prepare Android SDK 35 on GitHub runner
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check upstream Gradle dependency access
        run: |
          for url in \
            'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-reflect/2.0.21/kotlin-reflect-2.0.21.pom' \
            'https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-reflect/2.0.21/kotlin-reflect-2.0.21.pom' \
            'https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-reflect/2.0.21/kotlin-reflect-2.0.21.pom'; do
            printf '%s: ' "$url"
            curl -sSIL --max-time 15 --retry 2 -o /dev/null -w '%{http_code}\n' "$url" || true
          done
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish Android debug APK (not production signed) (7-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-backup-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_go_module_sbom.py'
      - run: |
          test -s LICENSE
          test -s README.md
          test -s cmd/backupctl/main.go
          test -s packaging/systemd/goreecloud-backup@.service
          test -s packaging/systemd/goreecloud-backup@.timer
          test -s cmd/backupctl/main.go
          test -s packaging/systemd/goreecloud-backup@.service
          test -s packaging/systemd/goreecloud-backup@.timer
          for doc in docs/ROADMAP.md docs/FEATURES.md docs/OBJECTIVES.md docs/THIRD_PARTY.md docs/SECURITY.md; do test -s "$doc"; done

  upstream-sources:
    name: upstream-sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          test -s third_party/kopia/LICENSE
          test -s third_party/rclone/COPYING
          test -s third_party/kopia/go.sum
          test -s third_party/rclone/go.sum
          sha256sum -c --status third_party/sources.sha256
